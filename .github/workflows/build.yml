name: Programm prüfen und bauen

# Prüft jeden Stand (Regeln, Rechenkern, Desktop-Programm im Fenster) und baut danach
# das Windows-Programm. Die fertigen Dateien hängen als Artefakte am jeweiligen Lauf.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Tests und Einzeldatei (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regeln prüfen
        run: npm run lint
      - name: Rechenkern prüfen (inkl. Vergleich mit der ursprünglichen HTML-Fassung)
        run: npm test
      - name: Oberfläche bauen
        run: npm run build
      - name: Desktop-Programm im Fenster prüfen
        run: xvfb-run -a node --test e2e/desktop.test.mjs
      - name: Einzeldatei für den Browser bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: M1-Qualifikationscockpit-Einzeldatei-HTML
          path: dist/standalone/M1_Qualifikationscockpit.html
          if-no-files-found: error

  windows:
    name: Windows-Programm (Installer und portable .exe)
    needs: pruefen
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write          # nur für den letzten Schritt: Version auf GitHub veröffentlichen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Oberfläche bauen
        run: npm run build
      - name: Programm packen
        run: npx electron-builder --win --x64 --publish never
      - name: Fertiges Programm im Fenster prüfen
        shell: pwsh
        run: |
          $env:M1_APP = (Resolve-Path "release/win-unpacked/M1 Qualifikationscockpit.exe").Path
          node --test e2e/desktop.test.mjs
      - name: Installer und portable .exe bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: M1-Qualifikationscockpit-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Dateien für die automatische Aktualisierung prüfen
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          ls -l release
          test -f "release/M1-Qualifikationscockpit-$v-Setup.exe"
          test -f "release/M1-Qualifikationscockpit-$v-Setup.exe.blockmap"
          test -f "release/M1-Qualifikationscockpit-$v-portable.exe"
          cat release/latest.yml
          grep -q "^version: $v" release/latest.yml
          grep -q "^path: M1-Qualifikationscockpit-$v-Setup.exe" release/latest.yml
          test -f "release/win-unpacked/resources/app-update.yml"
      # Jede neue Versionsnummer auf main wird einmal veröffentlicht. Installierte Programme finden sie dort
      # und aktualisieren sich selbst (electron/updater.js). Ohne neue Versionsnummer passiert nichts.
      - name: Version veröffentlichen (nur main, einmal je Versionsnummer)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $v ist bereits veröffentlicht – nichts zu tun."
            exit 0
          fi
          test -f release/latest.yml
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "M1 Qualifikationscockpit $v" \
            --notes "Installierte Programme aktualisieren sich selbst. Für die erste Installation: M1-Qualifikationscockpit-$v-Setup.exe laden und ausführen. Die portable Fassung aktualisiert sich nicht selbst." \
            "release/M1-Qualifikationscockpit-$v-Setup.exe" "release/M1-Qualifikationscockpit-$v-Setup.exe.blockmap" release/latest.yml "release/M1-Qualifikationscockpit-$v-portable.exe"
