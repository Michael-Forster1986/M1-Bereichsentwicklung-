<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>M1 Qualifikationscockpit</title>
<style>
/* ==========================================================================
   M1 Qualifikationscockpit · Gestaltung
   Grundsatz: neutrale Oberfläche in Marineblau/Grau – Farbe gehört den Daten.
   ========================================================================== */
:root{
  color-scheme:light;
  --plane:#f1f3f6; --surface:#ffffff; --surface-2:#f6f7f9; --surface-3:#eceff3;
  --ink:#131a22; --ink-2:#465160; --muted:#737e8b; --line:#e1e5ea; --line-2:#c9d0d9;
  --chrome:#0f2137; --chrome-2:#1a3150; --chrome-ink:#eef2f7; --chrome-muted:#a3b4c8;
  --accent:#17406d; --accent-2:#205590; --accent-ink:#ffffff; --sel:#e3edfa; --focus:#2a78d6;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#0a6b0a; --warn-ink:#7a5200; --crit-ink:#a52a2a;
  --t-theorie:#2a78d6; --t-praxis:#eb6834; --t-logbook:#1baf7a; --t-fitcheck:#eda100;
  --t-prep:#e87ba4; --t-ica:#008300; --t-bk:#6250d6; --t-fg:#e34948; --t-other:#8b94a0;
  --s-frueh:#86b6ef; --s-spaet:#2a78d6; --s-nacht:#104281;
  --abs-u:#9aa7b5; --abs-k:#5d6b7b; --abs-s:#c6cdd6;
  --series:#2a78d6; --series-soft:#cde2fb;
  --q0:#dbe9fb; --q1:#a6c9f4; --q2:#5598e7; --q3:#184f95;
  --grid:#e7eaee; --school:#f6eed2; --weekend:#f4f5f8; --holiday:#efe3f4;
  --shadow:0 10px 30px rgba(15,33,55,.18); --shadow-1:0 1px 2px rgba(15,33,55,.06);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --rail-w:188px; --top-h:52px;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --plane:#0e1114; --surface:#181b20; --surface-2:#1e2228; --surface-3:#262b32;
  --ink:#eef0f3; --ink-2:#c0c6ce; --muted:#8a939e; --line:#2a3038; --line-2:#3b424c;
  --chrome:#0a0d11; --chrome-2:#1b2633; --chrome-ink:#eef2f7; --chrome-muted:#8fa1b6;
  --accent:#3f7fc4; --accent-2:#5a95d6; --accent-ink:#ffffff; --sel:#1c2c42; --focus:#6aa9f0;
  --good-ink:#5fd05f; --warn-ink:#fbc552; --crit-ink:#f08a8a;
  --t-theorie:#3987e5; --t-praxis:#d95926; --t-logbook:#199e70; --t-fitcheck:#c98500;
  --t-prep:#d55181; --t-ica:#0ca30c; --t-bk:#9085e9; --t-fg:#e66767; --t-other:#7b8590;
  --s-frueh:#9ec5f4; --s-spaet:#3987e5; --s-nacht:#184f95;
  --abs-u:#6d7a88; --abs-k:#a9b4c0; --abs-s:#4a535e;
  --series:#3987e5; --series-soft:#1d3a5f;
  --q0:#172c47; --q1:#1c4a80; --q2:#3987e5; --q3:#9ec5f4;
  --grid:#262b32; --school:#3a3320; --weekend:#1d2126; --holiday:#33263a;
  --shadow:0 12px 34px rgba(0,0,0,.55); --shadow-1:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--plane);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)} .small{font-size:12.5px} .xs{font-size:11.5px}
.nowrap{white-space:nowrap} .right{text-align:right} .grow{flex:1 1 auto} .sp{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Rahmen ---------- */
.app{display:grid;grid-template:var(--top-h) 1fr / var(--rail-w) 1fr;height:100vh;min-height:0}
.top{grid-column:1/-1;background:var(--chrome);color:var(--chrome-ink);display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:6px;flex:0 1 auto;overflow:hidden}
.brand b{font-size:16px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btn,.top .pill{flex:none}
.brand span{color:var(--chrome-muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btn{background:transparent;border-color:rgba(255,255,255,.22);color:var(--chrome-ink)}
.top .btn:hover{background:rgba(255,255,255,.1)}
.top .btn.primary{background:#fff;color:var(--chrome);border-color:#fff;font-weight:600}
.top .btn.primary:hover{background:#dfe8f3}
.top .btn:disabled{opacity:.4}
.top .pill{border:1px solid rgba(255,255,255,.2);color:var(--chrome-ink);background:rgba(255,255,255,.06)}
.rail{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 16px}
.rail h4{font-size:11.5px;font-weight:600;color:var(--muted);padding:12px 10px 4px}
.rail button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left;color:var(--ink-2);font-size:13.5px}
.rail button:hover{background:var(--surface-2);color:var(--ink)}
.rail button[aria-current=page]{background:var(--sel);color:var(--ink);font-weight:600}
.rail .cnt{margin-left:auto;font-size:11.5px;font-weight:600;border-radius:9px;padding:0 6px;background:var(--surface-3);color:var(--ink-2)}
.rail .cnt.crit{background:var(--crit);color:#fff}
main{overflow:auto;padding:18px 22px 40px;min-width:0;outline:0}
.view-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.view-head h1{font-size:21px;font-weight:650;letter-spacing:-.015em}
.view-head p{color:var(--ink-2);font-size:13px;max-width:78ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gridA{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px}

/* ---------- Bausteine ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:3px 8px;font-size:12.5px;border-radius:6px}
.btn.danger{color:var(--crit-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--sel);border-color:var(--focus)}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:5px 8px;min-height:32px}
input[type=number]{width:84px} input.w60{width:64px} textarea{width:100%;min-height:90px;resize:vertical}
select{max-width:100%}
td select,td input{min-height:28px;padding:2px 6px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2)}
label.c{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
label.c input{width:15px;height:15px;accent-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow-1);min-width:0}
.card>h3{font-size:14.5px;font-weight:650;margin-bottom:2px}
.card>.sub{color:var(--ink-2);font-size:12.5px;margin-bottom:12px}
.card.flat{box-shadow:none;background:var(--surface-2)}
.note{border-left:3px solid var(--line-2);background:var(--surface-2);padding:9px 12px;border-radius:0 7px 7px 0;font-size:13px;color:var(--ink-2)}
.note.warn{border-color:var(--warn)} .note.crit{border-color:var(--crit)} .note.good{border-color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.good{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good-ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 24%,var(--surface));color:var(--warn-ink)}
.pill.crit{background:color-mix(in srgb,var(--crit) 15%,var(--surface));color:var(--crit-ink)}
.pill.info{background:var(--sel);color:var(--ink)}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:16px;padding:3px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed=true]{background:var(--sel);border-color:var(--focus);color:var(--ink);font-weight:600}
.chip b{font-weight:600;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;vertical-align:-1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
details>summary{cursor:pointer;font-weight:600;color:var(--ink-2);padding:4px 0}
kbd{font:inherit;font-size:12px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface-2)}

/* ---------- Tabellen ---------- */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);max-height:66vh}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-weight:600;color:var(--ink-2);padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{white-space:nowrap}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .who{min-width:150px;max-width:250px} .tbl .who b,.tbl .who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .who b{font-weight:600} .tbl .who small{color:var(--muted);font-size:11.5px}
.tbl select.cl{width:190px} .tbl input[type=date]{width:128px}
.tbl tr.rowcrit td:first-child{box-shadow:inset 3px 0 var(--crit)}
.tbl tr.rowwarn td:first-child{box-shadow:inset 3px 0 var(--warn)}
td.d-good{background:color-mix(in srgb,var(--good) 9%,var(--surface))}
td.d-warn{background:color-mix(in srgb,var(--warn) 26%,var(--surface))}
td.d-crit{background:color-mix(in srgb,var(--crit) 20%,var(--surface))}
td.d-na{background:var(--surface-3);color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---------- Kennzahlen ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;text-align:left;cursor:default}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--line-2);background:var(--surface-2)}
.kpi .l{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:27px;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.kpi .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.crit .v{color:var(--crit-ink)} .kpi.warn .v{color:var(--warn-ink)}

/* ---------- Jahresampel ---------- */
.ampel{--lab:48px;display:grid;grid-template-columns:var(--lab) minmax(0,1fr);row-gap:3px;align-items:center}
.ampel .lab{font-size:12px;color:var(--ink-2);white-space:nowrap}
.ampel .cells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));height:22px;border-radius:4px;overflow:hidden;background:var(--surface-3)}
.ampel .cells i{display:block;min-width:0}
.ampel .cells i:hover{outline:2px solid var(--ink);outline-offset:-1px;position:relative;z-index:1}
.ampel .months{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));font-size:11.5px;color:var(--muted);height:18px}
.ampel .months span{border-left:1px solid var(--line-2);padding-left:4px;overflow:hidden;white-space:nowrap}
.ampel .band{height:6px;border-radius:3px}
.ampel .band i.on{background:#cfae3d}
.c-q0{background:var(--q0)} .c-q1{background:var(--q1)} .c-q2{background:var(--q2)} .c-q3{background:var(--q3)}
.c-warn{background:var(--warn)} .c-crit{background:var(--crit)}
.c-na{background:repeating-linear-gradient(135deg,var(--surface-3) 0 3px,var(--line-2) 3px 4px)}
.c-off{background:var(--surface-3)}

/* ---------- Diagramme ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:11.5px var(--font);fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .lbl{fill:var(--ink-2)} .chart .ttl{fill:var(--ink);font-weight:600;font-size:12.5px}
.chart .gridl{stroke:var(--grid);stroke-width:1} .chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .net{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .thr{stroke:var(--ink-2);stroke-width:1.25} .chart .thr.min{stroke:var(--ink)}
.chart .v-warn{fill:var(--warn);opacity:.8} .chart .v-crit{fill:var(--crit);opacity:.85}
.chart .na{fill:var(--surface-3)} .chart .wash{fill:var(--series);opacity:.1}
.chart .cross{stroke:var(--ink);stroke-width:1;opacity:.55;pointer-events:none}
.chart .dot{fill:var(--series);stroke:var(--surface);stroke-width:2}
.chart .bar{fill:var(--series)} .chart .bar:hover{fill:var(--accent-2)}
.chart .schoolb{fill:#cfae3d;opacity:.7}
.meter{display:grid;grid-template-columns:minmax(150px,1.7fr) minmax(60px,2fr) 40px;gap:4px 10px;align-items:center;font-size:13px}
.meter button{all:unset;cursor:pointer;display:contents}
.meter .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.meter button:hover .nm{color:var(--ink);text-decoration:underline}
.meter .tr{height:8px;border-radius:4px;background:var(--series-soft);overflow:hidden}
.meter .tr i{display:block;height:100%;background:var(--series);border-radius:4px}
.meter .vv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.segbar{display:flex;gap:2px;height:28px}
.segbar>span{display:flex;align-items:center;padding:0 7px;border-radius:4px;font-size:12.5px;font-weight:600;color:#fff;min-width:3px;overflow:hidden;white-space:nowrap}
.segbar .dark{color:#0b0b0b}
.minis{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:end;font-size:13px}
.minis .bars{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;align-items:end;justify-items:center;height:34px;border-bottom:1px solid var(--line-2)}
.minis .bars i{background:var(--series);border-radius:3px 3px 0 0;min-height:0;width:min(100%,18px)}
.minis .bars i:hover{background:var(--accent-2)}
.hints{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hints li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.hints li:last-child{border-bottom:0}
.hints .ic{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--muted);margin-top:1px}
.hints .ic.crit{background:var(--crit)} .hints .ic.warn{background:var(--warn);color:#0b0b0b} .hints .ic.good{background:var(--good)}

/* ---------- Jahresplan (Gantt) ---------- */
.gantt{--lw:232px;--rh:32px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:auto;max-height:calc(100vh - 250px);min-height:260px;position:relative}
.g-head{position:sticky;top:0;z-index:6;display:flex;width:max-content;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.g-corner{position:sticky;left:0;z-index:7;width:var(--lw);flex:none;background:var(--surface-2);border-right:1px solid var(--line-2);padding:6px 10px;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.g-corner .caplab{display:grid;grid-template-rows:repeat(3,7px);gap:1px;font-size:9.5px;line-height:7px;color:var(--muted);text-align:right}
.g-time{position:relative;flex:none}
.g-months{position:relative;height:22px}
.g-months span{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-2);padding:3px 6px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.g-weeks{position:relative;height:15px}
.g-weeks span{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding-left:3px;font-size:10px;color:var(--muted);overflow:hidden}
.g-cap{display:grid;grid-template-rows:repeat(3,7px);gap:1px;padding-bottom:3px}
.g-cap div{display:flex}
.g-cap i{flex:none;display:block;height:7px}
.g-body{position:relative;width:max-content;min-width:100%}
.g-under{position:absolute;top:0;bottom:0;left:var(--lw);pointer-events:none}
.g-under i{position:absolute;top:0;bottom:0}
.g-under .m{border-left:1px solid var(--grid)} .g-under .w{background:var(--weekend)} .g-under .sc{background:var(--school);opacity:.75} .g-under .h{background:var(--holiday)}
.g-row{display:flex;height:var(--rh);border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto var(--rh);position:relative}
.g-row:hover .g-lab{background:var(--surface-2)}
.g-lab{position:sticky;left:0;z-index:4;width:var(--lw);flex:none;background:var(--surface);border-right:1px solid var(--line-2);padding:2px 8px 2px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;border-top:0;border-left:0;border-bottom:0;text-align:left;min-width:0}
.g-lab .t{min-width:0;flex:1}
.g-lab b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.g-lab small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.g-lab .st{flex:none;width:8px;height:8px;border-radius:50%}
.g-group{display:flex;height:26px;background:var(--surface-3);border-bottom:1px solid var(--line-2);position:relative}
.g-group div{position:sticky;left:0;padding:4px 10px;font-size:12.5px;font-weight:650;white-space:nowrap;z-index:4}
.g-track{position:relative;flex:none}
.bar{position:absolute;top:6px;height:16px;border:0;padding:0 4px;border-radius:3px;font-size:10.5px;line-height:16px;font-weight:600;color:#fff;white-space:nowrap;cursor:pointer;text-align:left;overflow:visible;min-width:2px}
.bar span{display:block;overflow:hidden;white-space:nowrap}
.bar:hover,.bar:focus-visible{filter:brightness(1.12);z-index:3;outline:2px solid var(--ink);outline-offset:1px}
.bar.fx{box-shadow:inset 3px 0 0 rgba(0,0,0,.42)}
.bar.sc{box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.bar.pt{border-top-right-radius:0;border-bottom-right-radius:0;background-image:linear-gradient(90deg,transparent calc(100% - 5px),rgba(255,255,255,.75) calc(100% - 5px))}
.bar.cf::after{content:"";position:absolute;right:-2px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
.bar.dim,.link.dim,.abs.dim{opacity:.16}
.link{position:absolute;top:13px;height:2px;opacity:.45;pointer-events:none}
.abs{position:absolute;bottom:3px;height:4px;border-radius:2px}
.t-Theorie{background:var(--t-theorie)} .t-Praxis{background:var(--t-praxis)} .t-PracticalLogbook{background:var(--t-logbook)}
.t-FitCheck{background:var(--t-fitcheck);color:#0b0b0b} .t-Vorbereitung{background:var(--t-prep)} .t-ICA{background:var(--t-ica)}
.t-BasicKnowledge{background:var(--t-bk)} .t-FG650{background:var(--t-fg)} .t-Sonstiges{background:var(--t-other)}
:root[data-theme=dark] .t-FitCheck{color:#fff}
.a-Urlaub{background:var(--abs-u)} .a-Krank{background:var(--abs-k)} .a-Sonstiges{background:var(--abs-s)}
.s-0{background:var(--s-frueh)} .s-1{background:var(--s-spaet)} .s-2{background:var(--s-nacht)}

/* ---------- Personenkalender ---------- */
.pcal{display:grid;grid-template-columns:34px repeat(31,minmax(0,1fr));gap:2px;font-size:10.5px}
.pcal .mh{color:var(--muted);align-self:center}
.pcal .dh{color:var(--muted);text-align:center}
.pcal i{display:block;aspect-ratio:1/1.05;border-radius:3px;position:relative;background:var(--surface-3);min-width:0}
.pcal i.none{background:none}
.pcal i.free{background:var(--surface-3)}
.pcal i.s-0{background:var(--s-frueh)} .pcal i.s-1{background:var(--s-spaet)} .pcal i.s-2{background:var(--s-nacht)}
.pcal i.wk{box-shadow:inset 0 2px 0 var(--line-2)}
.pcal i.ab::before{content:"";position:absolute;inset:0;border-radius:3px;background:repeating-linear-gradient(135deg,transparent 0 2px,var(--surface) 2px 4px);opacity:.9}
.pcal i em{position:absolute;left:1px;right:1px;bottom:1px;height:38%;border-radius:2px;border:1px solid var(--surface)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:minmax(110px,1fr) minmax(80px,2fr) 104px;gap:10px;align-items:center;font-size:13px}
.step .tr{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.step .tr i{display:block;height:100%;border-radius:4px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain .node{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;background:var(--surface);font-size:13px}
.chain .node b{font-weight:600} .chain .arrow{color:var(--muted)}

/* ---------- Überlagerungen ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column}
.drawer header,.dialog header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h2,.dialog header h2{font-size:16.5px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .body{overflow:auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:16px}
.drawer h3,.dialog h3{font-size:13.5px;font-weight:650;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(10,18,30,.5);z-index:60;display:grid;place-items:center;padding:20px}
.dialog{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(600px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.dialog.wide{width:min(880px,100%)}
.dialog .body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dialog footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4;max-width:340px;box-shadow:var(--shadow)}
.tip b{font-weight:650} .tip .k{opacity:.72} .tip table{border-collapse:collapse;margin-top:3px} .tip td{padding:1px 10px 1px 0;white-space:nowrap} .tip td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:0;padding-left:10px}
.tip .key{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(680px,calc(100vw - 24px))}
.toast{pointer-events:auto;background:var(--ink);color:var(--surface);border-radius:9px;padding:9px 14px;font-size:13.5px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:100%}
.toast.crit{background:var(--crit);color:#fff}
.toast button{all:unset;cursor:pointer;font-weight:650;text-decoration:underline;white-space:nowrap}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--sel);border:1px solid color-mix(in srgb,var(--focus) 35%,var(--surface));border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.progress{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
.cmp{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:0;font-size:13.5px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.cmp>*{padding:7px 12px;border-bottom:1px solid var(--line)}
.cmp>.h{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:12.5px}
.cmp>.n{text-align:right;font-variant-numeric:tabular-nums}
.cmp>:nth-last-child(-n+4){border-bottom:0}
.up{color:var(--good-ink);font-weight:600} .down{color:var(--crit-ink);font-weight:600}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 12px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.checks label{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datacards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dc{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.dc h3{font-size:14px;font-weight:650} .dc p{font-size:12.5px;color:var(--ink-2)}
.dc .row{margin-top:auto}
.prose{max-width:76ch;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--ink-2)}
.prose h3{color:var(--ink);font-size:15px;margin-top:8px} .prose ol,.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.prose b{color:var(--ink)}

/* ---------- Schmale Fenster ---------- */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.gridA,.grid3{grid-template-columns:1fr}}
@media (max-width:980px){
  .app{grid-template:var(--top-h) auto 1fr / 1fr}
  .rail{display:flex;gap:2px;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);overflow:auto;white-space:nowrap}
  .rail h4{display:none} .rail button{width:auto;flex:none}
  .grid2{grid-template-columns:1fr} main{padding:14px 12px 30px}
  .brand span,.top .hide-s{display:none} .gantt{--lw:150px}
}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.top .hide-xs,.top .pill{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Druck ---------- */
@media print{
  :root{--plane:#fff}
  .top,.rail,.toolbar,.toasts,.drawer,.modal,.tip,.banner,.noprint,.btn,.chip{display:none!important}
  .app{display:block;height:auto} main{overflow:visible;padding:0}
  .gantt,.tblwrap{max-height:none;overflow:visible;border:0}
  .g-head,.g-lab,.g-corner,.tbl th{position:static}
  .card,.kpi{break-inside:avoid;box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.g-open{position:sticky;left:calc(var(--lw) + 10px);display:inline-block;line-height:var(--rh);font-size:11.5px;color:var(--muted);white-space:nowrap}

</style>

<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <nav class="rail" id="rail" aria-label="Ansichten"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<aside class="drawer" id="drawer" aria-label="Einzelheiten" hidden></aside>
<div class="modal" id="modal" hidden></div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="filePick" hidden>
<noscript><p style="padding:24px">Dieses Werkzeug benötigt JavaScript. Es läuft vollständig lokal im Browser und überträgt keine Daten.</p></noscript>
<script id="embedded-state" type="application/json">null</script>
<script>
(() => {
'use strict';
/* ==========================================================================
 * M1 Qualifikationscockpit · Rechenkern
 * Reine Logik ohne DOM: Kalender, Kapazität, Planer, Konflikte, Importe.
 * Enthält keinerlei Personendaten; Demo-Daten werden synthetisch erzeugt.
 * ========================================================================== */
const Core = (() => {
  'use strict';

  // ---------- Konstanten -------------------------------------------------
  const FORMAT = 'M1-Cockpit', VERSION = 4, DAY = 86400000, EPS = 1e-9;
  const AREAS = ['M1', 'M2', 'M3'];
  const SHIFTS = ['Früh', 'Spät', 'Nacht'];
  const LOGBOOK = 'Practical Logbook', PREP = 'Vorbereitung';
  const TYPES = ['Basic Knowledge', 'FG650', 'Theorie', 'Praxis', LOGBOOK, 'FitCheck', PREP, 'ICA'];
  const GATE_TYPES = new Set(['Praxis', 'Theorie', 'Basic Knowledge']);
  const CLUSTERS = {
    '1': 'CAB-Erstentwicklung',
    '2': 'Frühauslerner → CAT A',
    '3': 'Basic Knowledge → CAT A',
    '4A': 'CAB → CAT A (Basic Knowledge vorhanden)',
    '4B': 'CAB → CAT A (nur FG650)',
    '5': 'Mustererweiterung innerhalb der Stufe',
    'offen': 'Entwicklungszuordnung offen',
    'ausgeschlossen': 'Keine neuen Maßnahmen'
  };
  const ROUTE_CLUSTERS = ['1', '2', '3', '4A', '4B', '5'];
  const DEFAULT_ROUTES = {
    '1': ['FitCheck', 'ICA'], '2': [LOGBOOK, 'FitCheck', 'ICA'], '3': [LOGBOOK, 'FitCheck', 'ICA'],
    '4A': [LOGBOOK, 'FitCheck', 'ICA'], '4B': [LOGBOOK, 'FitCheck', 'ICA'], '5': [LOGBOOK]
  };
  const ABS_TYPES = ['Urlaub', 'Krank', 'Sonstiges'];
  const TARGETS = ['A320', 'A330', 'A350', 'A380', 'A350/A380 Kombikurs'];
  const LEVELS = ['CAB', 'CAT A', 'TEC', 'CAT B'];
  const PATTERNS = ['A320', 'A330', 'A350', 'A380'];
  const ROSTER_CHARS = '.-FSNfsnxyz';           // 0 kein Eintrag · 1 Frei · 2.. Bereich×Dienst
  const SICK_DEFAULT = [7.45, 5.16, 8.54, 6.98, 6.57, 5.9, 5.89, 5.82, 5.79, 8.55, 9.13, 7.82];
  const SCHOOL_BY_2027 = [
    { name: 'Weihnachtsferien (Jahresanfang)', start: '2027-01-01', end: '2027-01-08' },
    { name: 'Frühjahrsferien', start: '2027-02-08', end: '2027-02-12' },
    { name: 'Osterferien', start: '2027-03-22', end: '2027-04-02' },
    { name: 'Pfingstferien', start: '2027-05-18', end: '2027-05-28' },
    { name: 'Sommerferien', start: '2027-08-02', end: '2027-09-13' },
    { name: 'Allerheiligen', start: '2027-11-02', end: '2027-11-05' },
    { name: 'Weihnachtsferien (Jahresende)', start: '2027-12-24', end: '2027-12-31' }
  ];

  // ---------- Hilfen -----------------------------------------------------
  const clone = x => JSON.parse(JSON.stringify(x));
  const num = x => { const v = Number(x); return Number.isFinite(v) ? v : 0; };
  const fin = x => typeof x === 'number' && Number.isFinite(x);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const truthy = x => x === true || ['true', '1', 'ja', 'j', 'x', 'yes', 'wahr'].includes(String(x ?? '').trim().toLowerCase());
  const kOf = (area, shift) => { const a = AREAS.indexOf(area), s = SHIFTS.indexOf(shift); return a < 0 || s < 0 ? -1 : a * 3 + s; };
  const kArea = k => AREAS[(k / 3) | 0], kShift = k => SHIFTS[k % 3];
  let uidN = 0;
  const uid = () => 'e' + Date.now().toString(36) + (uidN++).toString(36) + Math.random().toString(36).slice(2, 6);

  // ---------- Datum ------------------------------------------------------
  const parseT = s => Date.parse(s + 'T00:00:00Z');
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const validDate = s => {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const t = parseT(s); return Number.isFinite(t) && iso(t) === s;
  };
  const addDays = (s, n) => iso(parseT(s) + n * DAY);
  const fmtDE = s => validDate(s) ? s.slice(8) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : String(s || '');
  const fmtShort = s => validDate(s) ? s.slice(8) + '.' + s.slice(5, 7) + '.' : String(s || '');
  /** Akzeptiert JJJJ-MM-TT, TT.MM.JJJJ, T.M.JJ und Excel-Serienzahlen. */
  function normDate(v) {
    const s = String(v ?? '').trim();
    if (!s) return '';
    if (validDate(s)) return s;
    let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})$/);
    if (m) {
      const y = m[3].length === 2 ? '20' + m[3] : m[3];
      const r = y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
      return validDate(r) ? r : '';
    }
    m = s.match(/^(\d{4})[/.](\d{1,2})[/.](\d{1,2})$/);
    if (m) { const r = m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0'); return validDate(r) ? r : ''; }
    if (/^\d{5}(\.\d+)?$/.test(s)) { const n = Math.floor(Number(s)); if (n > 20000 && n < 80000) return iso(Date.UTC(1899, 11, 30) + n * DAY); }
    m = s.match(/^(\d{4}-\d{2}-\d{2})[T ]/);
    if (m && validDate(m[1])) return m[1];
    return '';
  }
  function makeCalendar(year) {
    const t0 = Date.UTC(year, 0, 1), n = Math.round((Date.UTC(year + 1, 0, 1) - t0) / DAY);
    const isoArr = new Array(n), dow = new Uint8Array(n), month = new Uint8Array(n), dom = new Uint8Array(n);
    const monthStart = [];
    for (let i = 0; i < n; i++) {
      const d = new Date(t0 + i * DAY);
      isoArr[i] = d.toISOString().slice(0, 10); dow[i] = d.getUTCDay(); month[i] = d.getUTCMonth(); dom[i] = d.getUTCDate();
      if (dom[i] === 1) monthStart.push(i);
    }
    monthStart.push(n);
    const idx = s => Math.round((parseT(s) - t0) / DAY);
    return { year, n, iso: isoArr, dow, month, dom, monthStart, idx, first: isoArr[0], last: isoArr[n - 1] };
  }
  function firstMonday(year) {
    for (let d = 1; d <= 7; d++) if (new Date(Date.UTC(year, 0, d)).getUTCDay() === 1) return iso(Date.UTC(year, 0, d));
    return year + '-01-01';
  }
  /** ISO-Kalenderwoche eines Datums. */
  function isoWeek(s) {
    const d = new Date(parseT(s)); const day = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - day + 3);
    const first = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    return 1 + Math.round(((d - first) / DAY - 3 + ((first.getUTCDay() + 6) % 7)) / 7);
  }
  /** Gesetzliche Feiertage Bayern (berechnet, als Vorschlag – vor Verwendung prüfen). */
  function holidaysBavaria(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
      g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
    const E = Date.UTC(y, mo - 1, da), off = n => iso(E + n * DAY), fix = (mm, dd) => iso(Date.UTC(y, mm - 1, dd));
    return [
      [fix(1, 1), 'Neujahr'], [fix(1, 6), 'Heilige Drei Könige'], [off(-2), 'Karfreitag'], [off(1), 'Ostermontag'],
      [fix(5, 1), 'Tag der Arbeit'], [off(39), 'Christi Himmelfahrt'], [off(50), 'Pfingstmontag'], [off(60), 'Fronleichnam'],
      [fix(8, 15), 'Mariä Himmelfahrt'], [fix(10, 3), 'Tag der Deutschen Einheit'], [fix(11, 1), 'Allerheiligen'],
      [fix(12, 25), '1. Weihnachtstag'], [fix(12, 26), '2. Weihnachtstag']
    ].map(([date, name]) => ({ date, name })).sort((p, q) => p.date < q.date ? -1 : 1);
  }

  // ---------- Vorgaben ---------------------------------------------------
  function defaultConfig() {
    const cfg = {};
    for (const k of ROUTE_CLUSTERS) {
      cfg[k] = {};
      for (const t of TYPES) {
        cfg[k][t] = {
          days: t === LOGBOOK ? (k === '5' ? 10 : ['3', '4B'].includes(k) ? 80 : 30)
            : t === 'FitCheck' ? (k === '1' ? 5 : 2)
              : t === 'ICA' || t === PREP ? 1 : t === 'Theorie' ? 20 : t === 'Praxis' ? 10 : null,
          trainee: t === PREP ? 0 : t === LOGBOOK ? (k === '5' ? 0.2 : 1) : 1,
          mentor: t === LOGBOOK ? (k === '5' ? 0.2 : 0.5) : 0,
          tec: t === 'FitCheck' || (t === 'ICA' && k === '1') ? 1 : 0,
          examiner: (t === 'ICA' && k !== '1') || t === PREP ? 1 : 0
        };
      }
    }
    return cfg;
  }
  const defaultLimits = () => ({
    M1: { 'Früh': { min: 16, zero: 25 }, 'Spät': { min: 11, zero: 13 }, 'Nacht': { min: 10, zero: 12 } },
    M2: { 'Früh': { min: null, zero: null }, 'Spät': { min: null, zero: null }, 'Nacht': { min: null, zero: null } },
    M3: { 'Früh': { min: null, zero: null }, 'Spät': { min: null, zero: null }, 'Nacht': { min: null, zero: null } }
  });
  const defaultSettings = year => ({
    start: firstMonday(year), cap: false, strict: false, confirmedOnly: false, goal: 'min', absenceLimit: null,
    avoidSchool: false, stress: 0, sick: SICK_DEFAULT.slice(), hours: 7.5,
    mentorLimit: null, tecLimit: null, examinerLimit: 1, allowPartial: true, preferZero: true, buffer: 0
  });
  function emptyState(year = 2027) {
    const now = new Date().toISOString();
    return {
      format: FORMAT, version: VERSION,
      meta: { title: 'M1 Jahressimulation ' + year, year, dataClass: 'empty', source: '', created: now, modified: now,
        privacy: false, simulated: { roster: false, absences: false }, assumptions: [] },
      people: [], events: [], absences: [], holidays: [], school: year === 2027 ? clone(SCHOOL_BY_2027) : [],
      capacity: [], roster: {}, limits: defaultLimits(), config: defaultConfig(), routes: clone(DEFAULT_ROUTES),
      settings: defaultSettings(year), report: [], planInfo: null, realImports: []
    };
  }

  // ---------- Personen ---------------------------------------------------
  const isLocked = p => !!p.locked || p.cluster === 'ausgeschlossen';
  function parseCluster(v) {
    const m = String(v ?? '').trim().match(/^(ausgeschlossen|offen|4A|4B|[1-5])(?=$|[\s·.:\-–—(])/i);
    if (!m) return '';
    const c = m[1].toLowerCase(), k = c === '4a' ? '4A' : c === '4b' ? '4B' : c;
    return CLUSTERS[k] ? k : '';
  }
  function normShift(v) {
    const s = String(v ?? '').trim().toLowerCase();
    if (['f', 'früh', 'frueh', 'fruh', 'frühdienst', 'early'].includes(s)) return 'Früh';
    if (['s', 'spät', 'spaet', 'spat', 'spätdienst', 'late'].includes(s)) return 'Spät';
    if (['n', 'nacht', 'nachtdienst', 'night'].includes(s)) return 'Nacht';
    if (['', '-', 'x', 'off', 'frei', 'free', '/', '0'].includes(s)) return 'Frei';
    return null;
  }
  function normPerson(p) {
    const cluster = parseCluster(p.cluster) || 'offen';
    const out = {
      pk: String(p.pk ?? '').trim(), name: String(p.name ?? '').trim(), alias: String(p.alias ?? '').trim(),
      org: String(p.org ?? '').trim(), rights: String(p.rights ?? '').trim() || '—',
      cluster, locked: truthy(p.locked) || cluster === 'ausgeschlossen',
      area: AREAS.includes(p.area) ? p.area : 'M1',
      shift: SHIFTS.includes(p.shift) ? p.shift : (SHIFTS.includes(normShift(p.shift)) ? normShift(p.shift) : 'Früh'),
      start: normDate(p.start), target: TARGETS.includes(p.target) ? p.target : '', level: LEVELS.includes(p.level) ? p.level : '',

function toast(text, kind = '', action = null) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.setAttribute('role', kind === 'crit' ? 'alert' : 'status');
  el.append(document.createTextNode(text));
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { el.remove(); safe(action.run); }; el.append(b); }
  const box = $('#toasts'); box.append(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), action ? 9000 : kind === 'crit' ? 7000 : 3800);
}
function safe(fn) {
  try { const r = fn(); if (r && typeof r.catch === 'function') r.catch(err => { console.error(err); toast('Fehler: ' + (err.message || err), 'crit'); }); return r; }
  catch (err) { console.error(err); toast('Fehler: ' + (err.message || err), 'crit'); }
}

}

// ---------- Tooltip ---------------------------------------------------------
const TIP = {};
let tipEl = null;
function showTip(target, x, y) {
  const tip = $('#tip'); let content = null;
  if (target.dataset.tk && TIP[target.dataset.tk]) content = TIP[target.dataset.tk](target, tipEl);
  else if (target.dataset.tip) content = html`${target.dataset.tip}`;
  if (!content) { tip.hidden = true; return; }
  setHTML(tip, content); tip.hidden = false;
  const r = tip.getBoundingClientRect(), W = innerWidth, H = innerHeight;
  let left = x + 14, top = y + 16;
  if (left + r.width > W - 8) left = Math.max(8, x - r.width - 12);
  if (top + r.height > H - 8) top = Math.max(8, y - r.height - 12);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip() { $('#tip').hidden = true; tipEl = null; }
document.addEventListener('pointermove', e => {
  const t = e.target.closest ? e.target.closest('[data-tk],[data-tip]') : null;
  if (!t) { if (tipEl) hideTip(); return; }
  tipEl = e.target; showTip(t, e.clientX, e.clientY);
}, { passive: true });
document.documentElement.addEventListener('pointerleave', hideTip);
document.addEventListener('scroll', hideTip, true);
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tk],[data-tip]'); if (t && e.target.matches(':focus-visible')) { tipEl = e.target; const r = e.target.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.bottom); } });

async function runPlanDialog() {
  const modeV = $('#planMode').value, opt = { replaceSynthetic: !!$('#planScenario')?.checked, allowPartial: $('#planPartial').checked };
  const preferZero = $('#planZero').checked;
  const work = Core.clone(S); work.settings.preferZero = preferZero; work.settings.allowPartial = opt.allowPartial;
  const ix = Core.buildIndex(work), btn = $('#planGo');
  btn.disabled = true; $('#planRun').hidden = false; $('#planResult').innerHTML = '';
  const t0 = performance.now(); let best = null, tried = 0;
  if (modeV === 'list' || modeV === 'prio') {
    const order = modeV === 'prio' ? Core.planVariants(work, 1)[0].order : null;
    const res = Core.runPlan(work, ix, { ...opt, order });
    best = { ...res, score: Core.scorePlan(work, ix, res), variant: modeV === 'prio' ? 'Planungspriorität' : 'Listenreihenfolge' }; tried = 1;
  } else {
    const variants = Core.planVariants(work, +modeV);
    for (const v of variants) {
      const res = Core.runPlan(work, ix, { ...opt, order: v.order }), score = Core.scorePlan(work, ix, res);
      if (Core.betterScore(score, best && best.score)) best = { ...res, score, variant: v.name };
      tried++;
      if (tried % 4 === 0) { $('#planRun .progress i').style.width = Math.round(tried / variants.length * 100) + '%'; $('#planMsg').textContent = tried + ' von ' + variants.length + ' Reihenfolgen geprüft …'; await nextFrame(); if ($('#modal').hidden) return; }
    }
  }
  $('#planRun').hidden = true; btn.disabled = false; btn.textContent = 'Erneut berechnen';
  const next = Core.clone(work); next.events = best.events; next.report = best.report;
  const nix = Core.buildIndex(next), nsum = Core.summarize(next, nix);
  const a = planMetrics(S, IX, SUM), b = planMetrics(next, nix, nsum);
  const row = (label, key, goodUp) => { const d = b[key] - a[key]; return html`<div>${label}</div><div class="n">${nf(a[key])}</div><div class="n"><b>${nf(b[key])}</b></div><div class="n ${d === 0 ? 'muted' : (d > 0) === goodUp ? 'up' : 'down'}">${d === 0 ? '±0' : (d > 0 ? '+' : '−') + nf(Math.abs(d))}</div>`; };
  setHTML($('#planResult'), html`
    <div class="cmp"><div class="h">Kennzahl</div><div class="h n">Aktuell</div><div class="h n">Neu</div><div class="h n">Änderung</div>
      ${row('Ausbildungswege vollständig geplant', 'complete', true)}${row('Teilweise geplant', 'partial', false)}${row('Ohne Termine (offen / blockiert)', 'none', false)}
      ${row('Diensttage unter Minimum', 'underMin', false)}${row('Diensttage unter 0-Punkt', 'underZero', false)}
      ${row('Geplante Ausbildungstage', 'days', true)}${row('Termine mit Konflikten', 'conflicts', false)}</div>
    <p class="small muted">${tried > 1 ? nf(tried) + ' Reihenfolgen verglichen · beste: ' + best.variant : best.variant} · ${nf(performance.now() - t0)} ms. Heuristik ohne Optimalitätsnachweis; die Kapazitätsgrenzen werden für jeden Tag einzeln geprüft.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="m:apply">Plan übernehmen</button></div>`);
  modalHandlers.apply = () => {
    closeModal();
    commit('Jahresplanung übernommen: ' + b.complete + ' Wege vollständig, ' + b.partial + ' teilweise', () => {
      S.settings.preferZero = preferZero; S.settings.allowPartial = opt.allowPartial;
      S.events = best.events; S.report = best.report;
      S.planInfo = { at: new Date().toISOString(), mode: modeV, variant: best.variant, tried };
    });
  };
}

function capClass(d, k) {
  const c = IX.cap;
  if (!c.known[k][d]) return c.src[k][d] ? 'c-na' : 'c-off';
  const net = c.pre[k][d] - IX.load.loss[k][d], dz = net - c.zero[k][d];
  if (net < c.min[k][d] - EPS) return 'c-crit';
  if (dz < -EPS) return 'c-warn';
  return dz >= 6 ? 'c-q0' : dz >= 3 ? 'c-q1' : dz >= 1 ? 'c-q2' : 'c-q3';       // Reserve über dem 0-Punkt in Köpfen

function buildHints() {
  const h = [], st = S.settings, add = (lvl, text, act) => h.push({ lvl, text, act });
  if (!S.people.length) { add('crit', 'Noch keine Personen geladen.', ['Stammdaten importieren', 'go', 'data']); return h; }
  if (S.meta.dataClass === 'demo') add('info', 'Demo-Daten aktiv: alle Personen, Dienste und Abwesenheiten sind frei erfunden.', ['Eigene Daten laden', 'go', 'data']);
  const pl = (n, one, many) => nf(n) + ' ' + (n === 1 ? one : many);
  if (CONF.size) add('crit', pl(CONF.size, 'Termin mit Konflikt', 'Termine mit Konflikten') + ' (Abwesenheit, Dienst, Kollision oder Kapazität).', ['Zum Bericht', 'go', 'report']);
  if (SUM.underMin) add('crit', pl(SUM.underMin, 'Diensttag liegt', 'Diensttage liegen') + ' unter dem Minimum.', ['Kapazität ansehen', 'go', 'capacity']);
  if (SUM.underZero) add('warn', pl(SUM.underZero, 'Diensttag liegt', 'Diensttage liegen') + ' unter dem 0-Punkt.', ['Kapazität ansehen', 'go', 'capacity']);
  if (SUM.route.partial) add('warn', pl(SUM.route.partial, 'Ausbildungsweg lässt', 'Ausbildungswege lassen') + ' sich ' + S.meta.year + ' nur teilweise einplanen.', ['Zum Bericht', 'go', 'report']);
  if (SUM.route.none) add('warn', pl(SUM.route.none, 'Person mit Ausbildungsweg hat', 'Personen mit Ausbildungsweg haben') + ' noch keine Termine.', ['Zum Bericht', 'go', 'report']);
  const noRoster = S.people.filter(p => !S.roster[p.pk]).length;
  if (noRoster === S.people.length) add(st.strict ? 'crit' : 'warn', 'Kein Dienstplan geladen – ' + (st.strict ? 'im strikten Modus kann nichts geplant werden.' : 'es gilt die Szenariozuordnung je Person.'), ['Dienstplan importieren', 'go', 'data']);
  else if (noRoster) add('warn', 'Für ' + nf(noRoster) + ' Personen fehlt der Dienstplan.', ['Daten prüfen', 'go', 'data']);
  if (S.meta.simulated.roster && S.meta.dataClass !== 'demo') add('warn', 'Der Dienstplan ist simuliert, nicht der freigegebene Plan.', ['Realen Dienstplan laden', 'go', 'data']);
  if (S.meta.simulated.absences && S.meta.dataClass !== 'demo') add('warn', 'Urlaub und Abwesenheiten sind simuliert.', ['Finale Abwesenheiten laden', 'go', 'data']);
  if (!S.holidays.length) add('warn', 'Keine Feiertage hinterlegt – Ausbildungstage können auf Feiertage fallen.', ['Feiertage eintragen', 'go', 'absences']);
  if (SUM.clusters.offen) add('info', nf(SUM.clusters.offen) + ' Personen ohne Clusterzuordnung werden nicht geplant.', ['Personen ansehen', 'cluster-jump', 'offen']);
  const c5 = S.people.filter(p => p.cluster === '5' && (!p.target || !p.level)).length;
  if (c5) add('warn', nf(c5) + ' Personen in Cluster 5 ohne Zielmuster oder Zielstufe.', ['Personen ansehen', 'cluster-jump', '5']);
  const assumed = S.people.filter(p => p.targetAssumed).length;
  if (assumed) add('info', 'Zielmuster von ' + nf(assumed) + ' Personen in Cluster 5 sind Annahmen und fachlich zu bestätigen.');
  if (!st.cap) add('info', 'Szenariomodus: Kapazitätsgrenzen werden bei der Planung nicht verbindlich geprüft.', ['Einstellungen', 'go', 'capacity']);
  if (SUM.unknownDays && st.cap) add('warn', 'An ' + nf(SUM.unknownDays) + ' Diensttagen in M1 ist die Kapazität nicht prüfbar.', ['Kapazität ansehen', 'go', 'capacity']);
  if (!h.some(x => x.lvl === 'crit' || x.lvl === 'warn')) add('good', 'Keine offenen Punkte: Plan ist konfliktfrei und hält alle Grenzen ein.');
  return h;
}

function matchQ(p, q) {
  if (!q) return true;
  const hay = (pName(p) + ' ' + pSub(p) + ' ' + p.alias + ' ' + p.target + ' ' + p.level + ' ' + p.cluster + ' ' + (privacy() ? '' : p.org)).toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function filteredPeople() {
  const firstStart = p => (IX.evByPerson.get(p.pk) || []).reduce((m, e) => e.start < m ? e.start : m, '9999');
  let list = S.people.filter(p => (!UI.cluster || p.cluster === UI.cluster) && matchQ(p, UI.q) && (() => {
    const st = PROG.get(p.pk).state, has = IX.evByPerson.has(p.pk);
    switch (UI.gStatus) {
      case 'with': return has; case 'without': return !has && (st === 'none');
      case 'incomplete': return st === 'partial' || st === 'none';
      case 'conflict': return (IX.evByPerson.get(p.pk) || []).some(e => CONF.has(e.id) && CONF.get(e.id).hard.length);
      default: return true;
    }
  })());
  const cmp = { name: (a, b) => collator.compare(sortKey(a), sortKey(b)), cluster: (a, b) => collator.compare(a.cluster, b.cluster) || collator.compare(sortKey(a), sortKey(b)),
    start: (a, b) => firstStart(a) < firstStart(b) ? -1 : firstStart(a) > firstStart(b) ? 1 : 0,
    end: (a, b) => (PROG.get(a.pk).end || '9999') < (PROG.get(b.pk).end || '9999') ? -1 : 1 }[UI.gSort];
  if (cmp) list = list.slice().sort(cmp);
  else if (privacy()) list = list.slice().sort((a, b) => collator.compare(a.alias, b.alias));   // Listenreihenfolge würde die alphabetische Reihenfolge verraten
  return list;
}

function renderDrawer() {

function personCalendar(p) {
  const i = IX.pi.get(p.pk), cal = IX.cal; let s = '<span></span>';
  for (let dd = 1; dd <= 31; dd++) s += '<span class="dh">' + (dd % 5 === 0 || dd === 1 ? dd : '') + '</span>';
  for (let m = 0; m < 12; m++) {
    s += '<span class="mh">' + MON[m] + '</span>';
    const len = cal.monthStart[m + 1] - cal.monthStart[m];
    for (let dd = 0; dd < 31; dd++) {
      if (dd >= len) { s += '<i class="none"></i>'; continue; }
      const d = cal.monthStart[m] + dd, k = Core.assign(IX, i, d), ev = IX.evByDay[d].find(e => e.pk === p.pk && e.type !== Core.PREP) || IX.evByDay[d].find(e => e.pk === p.pk);
      s += '<i class="' + (k >= 0 ? 's-' + (k % 3) : 'free') + (cal.dow[d] === 0 || cal.dow[d] === 6 ? ' wk' : '') + (IX.abs[i][d] ? ' ab' : '') + '" data-tk="pday" data-d="' + d + '">' + (ev ? '<em class="' + tcls(ev.type) + '"></em>' : '') + '</i>';
    }
  }
  return raw(s);
}

CHG.person = t => {
  const p = P(t.dataset.pk), f = t.dataset.f; if (!p) return;
  const yr = String(S.meta.year); let v = t.type === 'checkbox' ? t.checked : t.value;
  if ((f === 'start' || f === 'gate') && v && (!Core.validDate(v) || !v.startsWith(yr))) { render(); return toast('Datum muss im Jahr ' + yr + ' liegen', 'crit'); }
  if (f === 'cluster' && p.locked) { render(); return toast('Gesperrte Person: Cluster nicht änderbar', 'crit'); }

    if (f.startsWith('rot')) { const r = p.rotation ? p.rotation.slice() : [0, 0, 0]; r[+f.slice(3)] = Core.clamp(Math.round(+v || 0), 0, 260); p.rotation = r; }

      ${(() => { const cs = [0, 1, 2].map(s => Core.capInfo(IX, d, a * 3 + s)); const row = (label, f, cls = '') => html`<tr><td class="${cls}">${label}</td>${cs.map(c => html`<td class="n ${cls}">${c.known || c.src ? f(c) : '–'}</td>`)}</tr>`;
        return [row('Laut Dienstplan', c => Number.isFinite(c.gross) ? nf(c.gross) : '–'), row('− Abwesend', c => nf(c.absent), 'muted'), row('− Krankenreserve', c => nf(c.reserve, 1), 'muted'), row('− Maßnahmen', c => nf(c.loss, 1), 'muted'),

function drawAbsChart() {
  const box = $('#absChart'); if (!box) return;
  const n = IX.n, W = Math.max(320, box.clientWidth), L = 30, R = 8, T = 8, H = 96, B = 20, vals = new Float64Array(n);
  for (let k = 0; k < 9; k++) for (let d = 0; d < n; d++) vals[d] += IX.absR[k][d];
  const hi = Math.max(4, ...vals) * 1.1, step = (W - L - R) / n, y = v => T + (1 - v / hi) * H, stepV = [2, 5, 10, 20, 50].find(v => hi / v <= 4.2) || 100;
  let g = '', line = '';
  for (let v = 0; v <= hi; v += stepV) g += '<line class="' + (v ? 'gridl' : 'axis') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + v + '</text>';
  for (let d = 0; d < n; d++) line += (d ? 'L' : 'M') + (L + (d + 0.5) * step).toFixed(1) + ' ' + y(vals[d]).toFixed(1);
  g += '<path class="wash" d="' + line + 'L' + (W - R) + ' ' + y(0) + 'L' + L + ' ' + y(0) + 'Z"/><path class="net" d="' + line + '"/>';
  for (let m = 0; m < 12; m++) g += '<text x="' + (L + IX.cal.monthStart[m] * step + 4).toFixed(1) + '" y="' + (T + H + 15) + '">' + MON[m] + '</text>';
  g += '<line class="cross" y1="' + T + '" y2="' + (T + H) + '" visibility="hidden"/><rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + H + '" fill="transparent" data-tk="abschart" data-l="' + L + '" data-step="' + step + '"/>';
  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + (T + H + B) + '" height="' + (T + H + B) + '" role="img" aria-label="Abwesende Personen im Dienst je Tag">' + g + '</svg>';
}

  openModal({ title, wide: true, body: html`
    <div class="cmp" style="grid-template-columns:1fr 1.4fr"><div class="h">Datei</div><div class="h">${file}</div>${facts.map(([k, v]) => html`<div>${k}</div><div class="n">${v}</div>`)}</div>

    ${warns.length ? html`<div class="note warn">${warns.slice(0, 12).map(w => html`<div>${w}</div>`)}${warns.length > 12 ? html`<div>… ${warns.length - 12} weitere Hinweise</div>` : ''}</div>` : ''}`,

async function readTable(file) {

  return { rows: Core.parseCSV(await file.text()), note: 'CSV' };
}

    apply: () => { commit(nf(chk.rows.length) + ' Tageswerte übernommen', () => { S.capacity = chk.rows; }); } });
};
ACT['imp-events'] = async () => {
  if (!S.people.length) return toast('Zuerst Stammdaten laden', 'crit');

  const { head, rows } = Core.rowsToObjects(Core.parseCSV(await file.text())), chk = Core.checkEvents(S, rows, head);
  importPreview({ title: 'Feste Termine prüfen', file: file.name, chk, facts: [['Termine in der Datei', nf(chk.rows.length)]], extra: html`<p class="small ink2">Die Termine werden als fixierte Termine ergänzt (z. B. gebuchte Kurse). Vorhandene Termine bleiben unverändert.</p>`,
    apply: () => { commit(nf(chk.rows.length) + ' feste Termine ergänzt', () => { S.events.push(...chk.rows); }); } });
};
ACT['imp-school'] = async () => {
  const file = await pickFile('.csv,.txt'); if (!file) return;
  const { rows } = Core.rowsToObjects(Core.parseCSV(await file.text())), out = [], errors = [];
  rows.forEach((r, i) => { const s = Core.normDate(r.start), e = Core.normDate(r.end); if (!s || !e || e < s) errors.push('Zeile ' + (i + 2) + ': Zeitraum ungültig'); else out.push({ name: String(r.name || 'Ferien').slice(0, 80), start: s, end: e }); });
  importPreview({ title: 'Ferien prüfen', file: file.name, chk: { errors }, facts: [['Ferienzeiträume', nf(out.length)]], apply: () => { commit('Ferien ersetzt', () => { S.school = out.sort((a, b) => a.start < b.start ? -1 : 1); }); } });
};
ACT['imp-key'] = async () => {
  const file = await pickFile('.csv,.txt'); if (!file) return;
  const { head, rows } = Core.rowsToObjects(Core.parseCSV(await file.text()));
  if (!head.includes('alias') || !head.includes('pk')) throw new Error('Schlüsseldatei braucht die Spalten alias und pk');
  let hit = 0; commit('', () => { hit = Core.reidentify(S, rows); });
  toast(hit ? nf(hit) + ' von ' + nf(S.people.length) + ' Personen wieder zugeordnet' : 'Keine passenden Pseudonyme gefunden', hit ? '' : 'crit');
};
ACT['tpl'] = t => templateDownload(t.dataset.k);
ACT['exp-roster'] = () => { const sc = impScope(), a = IX.cal.idx(sc.start), b = IX.cal.idx(sc.end), rows = []; S.people.forEach((p, i) => { for (let d = a; d <= b; d++) { const c = IX.ros[i][d]; rows.push([privacy() ? p.alias : p.pk, IX.cal.iso[d], c >= 2 ? Core.kArea(c - 2) : 'M1', c >= 2 ? Core.kShift(c - 2) : 'Frei']); } }); csvDownload('Dienstplan', Core.TEMPLATES.roster, rows); };
ACT['exp-pseudo'] = () => {
  const { state, key } = Core.pseudonymize(S), stamp = new Date().toISOString().slice(0, 10);
  download('M1_Cockpit_' + S.meta.year + '_Projekt_' + stamp + '_pseudonymisiert.json', JSON.stringify(state));
  if (S.meta.dataClass === 'real') setTimeout(() => download('M1_Cockpit_' + S.meta.year + '_Schluesseldatei_' + stamp + '_VERTRAULICH.csv', Core.toCSV(Core.TEMPLATES.key, key.map(k => [k.alias, k.pk, k.name, k.org])), 'text/csv'), 600);
  toast(S.meta.dataClass === 'real' ? 'Zwei Dateien: pseudonymisierte Projektdatei und Schlüsseldatei. Die Schlüsseldatei bleibt in der geschützten Umgebung.' : 'Pseudonymisierte Projektdatei gesichert');
};
CHG.imp = t => { IMP[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; };
CHG.meta = t => { const v = t.value.trim().slice(0, 120); if (v) commit('Projekttitel gespeichert', () => { S.meta.title = v; }); };
CHG.autosave = t => { if (t.checked) { store.set(LS.on, '1'); autosave(); toast('Zwischenspeichern im Browser eingeschaltet'); } else { store.del(LS.on); store.del(LS.state); toast('Zwischenspeicher ausgeschaltet und geleert'); } render(); };
ACT['wipe'] = async () => {
  if (!await confirmDlg('Alle Daten aus diesem Fenster entfernen', 'Planungsstand, Rückgängig-Verlauf und Browser-Zwischenspeicher werden geleert. Nicht gesicherte Änderungen gehen verloren.', 'Alles entfernen', true)) return;
  store.del(LS.state); hist.length = 0; future.length = 0; const y = S.meta.year; S = null; replaceState(Core.emptyState(y), 'Alle Daten entfernt'); hist.length = 0; go('data');
};

VIEWS.help = {
  render() {
    const col = (k, cols, note) => html`<tr><td><b>${k}</b></td><td>${cols}</td><td class="muted">${note}</td></tr>`;
    return html`
    <div class="view-head"><div><h1>Anleitung</h1><p>Aufbau, Rechenregeln und Grenzen des Werkzeugs.</p></div></div>
    <div class="grid2"><div class="card"><div class="prose">
      <h3 style="margin-top:0">In fünf Schritten zum Jahresplan</h3>
      <ol><li><b>Daten laden</b> – unter „Daten & Datenschutz“ die Datei der Vorgängerversion oder Stammdaten, Dienstplan und Abwesenheiten laden. Bis dahin zeigt das Programm synthetische Demo-Daten.</li>
        <li><b>Cluster und Ziele prüfen</b> – unter „Personen & Cluster“. Cluster 5 braucht Zielmuster und Zielstufe; Cluster 3 / 4B brauchen einen Praxis-Kursrahmen oder das Abschlussdatum aller Doings.</li>
        <li><b>Ausbildungswege bestätigen</b> – Dauer und Verlustfaktoren je Cluster, bei Bedarf individuell je Person.</li>
        <li><b>Neu berechnen</b> – das Programm vergleicht viele Reihenfolgen und zeigt das beste Ergebnis im Vorher/Nachher-Vergleich. Erst „Plan übernehmen“ ändert den Stand.</li>
        <li><b>Prüfen und sichern</b> – Jahresampel, Jahresplan und Bericht ansehen, einzelne Termine fixieren, Projektdatei sichern.</li></ol>
      <h3>So rechnet die Kapazität</h3>
      <p>Verfügbar = Köpfe laut Dienstplan − Abwesende − Krankenreserve (Monatswert + Stress) − Maßnahmenverlust. Der Maßnahmenverlust ist die Summe aus Teilnehmer-, Mentor-, TEC- und Prüferanteil und wird dem Dienst der teilnehmenden Person zugerechnet. Jeder Wert wird genau einmal abgezogen.</p>
      <p><b>0-Punkt</b> ist die Sollbesetzung, <b>Minimum</b> die Untergrenze. Im Kapazitätsmodus plant das Programm nie unter die harte Grenze. Mit „0-Punkt bevorzugen“ arbeitet es dreistufig: erst nur Tage ab 0-Punkt, dann Fehltage bis zum Minimum auffüllen, zuletzt frei bis zum Minimum.</p>
      <h3>So verteilt der Planer</h3>
      <ul><li>Ausbildungstage liegen auf Arbeitstagen (Mo–Fr, ohne Feiertage) mit vorgesehenem Dienst, nie auf Abwesenheiten.</li>
        <li>Theorie, Praxis, FitCheck, ICA und Vorbereitung nur im Frühdienst; Logbook-Tage in jedem Dienst.</li>
        <li>Mentor-, TEC- und Prüferpools begrenzen die gleichzeitige Betreuung je Dienst.</li>
        <li>Die ICA liegt nach dem Abschluss aller Doings und nach Kursen; ein Tag Vorbereitung davor bindet nur Prüfer oder TEC.</li>
        <li>Fixierte Termine bleiben stehen, zählen zum Weg und werden nie doppelt erzeugt.</li>
        <li>Planungspriorität 1 wird zuerst verteilt; innerhalb gleicher Priorität sucht der Variantenvergleich die beste Reihenfolge.</li></ul>
      <h3>Lehrgänge</h3>
      <p>Die Lehrgangsplanung sucht zusammenhängende Zeiträume. „Größtmögliche Gruppe“ prüft je Starttag, wer teilnehmen kann, und nimmt so lange Personen heraus, bis die Grenze an jedem Tag hält. Dienstfreie Tage im Lehrgang gelten als Dienstplananpassung ohne Produktionsverlust.</p>
    </div></div>
    <div class="stack"><div class="card"><div class="prose">
      <h3 style="margin-top:0">Wichtige Grenzen</h3>
      <ul><li>Planungswerkzeug, keine zertifizierte Qualifikations- oder Produktionsfreigabe. Ausbildungsfolgen und Verlustfaktoren sind fachlich zu bestätigen.</li>
        <li>Alle Köpfe zählen gleich; Skill-Mix, Arbeitszeitregeln, Ruhezeiten und Betriebsvereinbarungen werden nicht geprüft.</li>
        <li>Mentor-, TEC- und Prüferwerte sind Planungsäquivalente, keine namentliche Verfügbarkeitsprüfung.</li>
        <li>Krankenquoten sind historische Planungsannahmen, keine Prognose. Cluster und Berechtigungen sind keine Leistungsbewertung.</li>
        <li>M2 / M3-Rotation im Logbook nur, wenn Rotationstage je Person eingetragen und Grenzwerte für diese Bereiche hinterlegt sind.</li>
        <li>Der Variantenvergleich ist eine Heuristik ohne Optimalitätsnachweis.</li></ul>
      <h3>Dateiformate</h3></div>
      <div class="tblwrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>Datei</th><th>Spalten</th><th>Hinweis</th></tr></thead><tbody>
        ${col('Stammdaten', Core.TEMPLATES.people.join('; '), 'nur pk ist Pflicht; deutsche Spaltennamen werden erkannt')}
        ${col('Dienstplan', 'pk; date; area; shift', 'oder Matrix: pk; Datum; Datum; …')}
        ${col('Abwesenheiten', 'pk; start; end; type', 'Urlaub, Krank, Sonstiges')}
        ${col('Feste Termine', Core.TEMPLATES.events.join('; '), 'Maßnahme wie in der Legende')}
        ${col('Tageskapazität', Core.TEMPLATES.capacity.join('; '), 'zero ≥ min')}
        ${col('Schlüsseldatei', 'alias; pk; name; org', 'entsteht beim pseudonymisierten Sichern')}</tbody></table></div></div>
      <div class="card"><div class="prose"><h3 style="margin-top:0">Bedienung</h3>
        <ul><li><kbd>Strg</kbd> + <kbd>Z</kbd> rückgängig, <kbd>Strg</kbd> + <kbd>Y</kbd> wiederholen, <kbd>Strg</kbd> + <kbd>S</kbd> Projektdatei sichern, <kbd>Esc</kbd> schließt Dialoge.</li>
          <li>Überall gilt: Tag, Balken oder Name anklicken öffnet die Einzelheiten.</li><li>Jede Ansicht lässt sich drucken; die Druckansicht blendet Bedienelemente aus.</li></ul>
        <p class="small muted">M1 Qualifikationscockpit · Format ${Core.FORMAT} ${Core.VERSION} · läuft vollständig lokal im Browser, ohne Installation und ohne externe Bibliotheken.</p></div></div></div></div>`;
  }
};
